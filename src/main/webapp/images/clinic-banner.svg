<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="url(#bgGrad)"/>

  <!-- Decorative Waves -->
  <path d="M0 200 C 150 260, 350 140, 600 220 L 600 300 L 0 300 Z" fill="rgba(255,255,255,0.08)"/>
  <path d="M0 160 C 200 100, 400 240, 600 140 L 600 300 L 0 300 Z" fill="rgba(255,255,255,0.05)"/>

  <!-- Tooth Graphic -->
  <g transform="translate(420, 50) scale(1.2)">
    <path d="M40 10 C 25 10, 10 25, 10 55 C 10 85, 25 110, 30 140 C 33 158, 38 175, 45 175 C 52 175, 53 155, 60 140 C 67 155, 68 175, 75 175 C 82 175, 87 158, 90 140 C 95 110, 110 85, 110 55 C 110 25, 95 10, 80 10 C 68 10, 63 20, 60 20 C 57 20, 52 10, 40 10 Z" fill="url(#toothGrad)" opacity="0.95" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.3))"/>
  </g>

  <!-- Clinic Text Banner -->
  <text x="40" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="1">SUNRISE DENTAL</text>
  <text x="40" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="18" fill="#7dd3fc" letter-spacing="2">CARE &amp; EXCELLENCE</text>

  <!-- Sparkles -->
  <circle cx="390" cy="70" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="560" cy="180" r="5" fill="#7dd3fc" opacity="0.7"/>
  <circle cx="480" cy="220" r="3" fill="#ffffff" opacity="0.9"/>
</svg>
